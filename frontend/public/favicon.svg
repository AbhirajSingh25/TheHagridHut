<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="1" />
      <stop offset="45%" stop-color="#E8AD62" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#B45309" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#35251D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B3024" />
      <stop offset="50%" stop-color="#35251D" />
      <stop offset="100%" stop-color="#211B17" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background study tile with rounded border -->
  <rect width="64" height="64" rx="16" fill="url(#woodGrad)" stroke="#536B4F" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Amber Ambient Light -->
  <circle cx="32" cy="34" r="22" fill="url(#amberGlow)" filter="url(#softGlow)" />

  <!-- Lantern Loop -->
  <circle cx="32" cy="14" r="5" fill="none" stroke="url(#brassGrad)" stroke-width="2.5" />

  <!-- Lantern Cap / Roof -->
  <path d="M22 20 L32 15 L42 20 Z" fill="url(#brassGrad)" />
  <rect x="20" y="20" width="24" height="3" rx="1.5" fill="#B45309" />

  <!-- Glass Chamber -->
  <rect x="23" y="23" width="18" height="22" rx="2" fill="#FFF7E9" fill-opacity="0.15" stroke="url(#brassGrad)" stroke-width="1.5" />

  <!-- Inner Warm Flame -->
  <path d="M32 28 C30 31, 28 34, 30 38 C31 40, 33 41, 32 41 C31 41, 33 40, 34 38 C36 34, 34 31, 32 28 Z" fill="#FDE68A" filter="url(#softGlow)"/>
  <circle cx="32" cy="37" r="2.5" fill="#FFF" />

  <!-- Lantern Base -->
  <rect x="21" y="45" width="22" height="4" rx="2" fill="url(#brassGrad)" />
  <rect x="24" y="49" width="16" height="2" rx="1" fill="#78350F" />

  <!-- Forest Green Accent Touch -->
  <circle cx="48" cy="16" r="2" fill="#536B4F" opacity="0.8" />
  <circle cx="16" cy="48" r="2" fill="#536B4F" opacity="0.8" />
</svg>